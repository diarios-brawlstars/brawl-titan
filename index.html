<!DOCTYPE html>
<html>
<head>
  <title>Brawl Titan</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #f4f0e8;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    h1 { color: #8b4513; }
    input {
      display: block;
      margin: 10px auto;
      padding: 8px;
      width: 250px;
    }
    .pix-box {
      background-color: #fff;
      border: 2px dashed #8b4513;
      width: 260px;
      margin: 20px auto;
      padding: 10px;
      font-weight: bold;
    }
    .codigo-box {
      background-color: #d4f4dd;
      border: 2px solid green;
      width: 260px;
      margin: 20px auto;
      padding: 15px;
      font-weight: bold;
      font-size: 20px;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
    #btnContinuar { background-color: #8b4513; color: white; }
    #btnAdm { background-color: #25D366; color: white; }
    #btnVip { background-color: #2a6df4; color: white; }
    .escondido { display: none; }
    .link-menu {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
      display: block;
    }
    #painelAdm, #painelVip {
      background: #fff;
      border: 2px solid #8b4513;
      max-width: 400px;
      margin: 20px auto;
      padding: 15px;
      text-align: left;
    }
    .pessoa {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }
    .pago { color: green; font-weight: bold; }
    .pendente { color: #b00; }
  </style>
</head>
<body>
  <h1>Bem-vindo à Brawl Titan!</h1>
  <p>Preencha seus dados:</p>

  <input type="text" id="nome" placeholder="Seu nome completo">
  <input type="tel" id="telefone" placeholder="Seu telefone">
  <input type="text" id="nickname" placeholder="Seu nick no jogo">

  <button id="btnContinuar" onclick="mostrarPagamento()">Continuar</button>

  <div id="areaPagamento" class="escondido">
    <p>Chave PIX para pagamento:</p>
    <div class="pix-box" id="pixTexto">Carregando...</div>
    <button id="btnAdm" onclick="chamarAdm()">CHAMA ADM NO WHATSAPP</button>
  </div>

  <a href="#" class="link-menu" onclick="document.getElementById('painelVip').classList.remove('escondido'); return false;">Já paguei, ver código da sala</a>
  <a href="#" class="link-menu" onclick="entrarAdm(); return false;">Área administrativa</a>

  <div id="painelVip" class="escondido">
    <h3>Ver código da sala</h3>
    <p>Digite o telefone que você cadastrou:</p>
    <input type="tel" id="vipTelefone" placeholder="Seu telefone">
    <button id="btnVip" onclick="verificarPagamento()">Entrar</button>
    <div id="resultadoVip" style="margin-top:15px;"></div>
  </div>

  <div id="painelAdm" class="escondido">
    <h3>Modo ADM</h3>

    <p><b>Chave PIX:</b></p>
    <input type="text" id="admPix" placeholder="Digite a chave PIX">

    <p><b>Código da sala:</b></p>
    <input type="text" id="admCodigoSala" placeholder="Digite o código da sala">

    <button onclick="salvarConfig()">Salvar PIX e código</button>

    <h3>Cadastros:</h3>
    <div id="listaCadastros">Carregando...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDpyFBnIRemuZf6G-x8hOGO5ohfx5G7C5w",
      authDomain: "brawl-titan-1f6e1.firebaseapp.com",
      projectId: "brawl-titan-1f6e1",
      storageBucket: "brawl-titan-1f6e1.firebasestorage.app",
      messagingSenderId: "575817702704",
      appId: "1:575817702704:web:94aced5b4b678d6c3cfcf5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("config").doc("geral").get().then(function(doc) {
      if (doc.exists) {
        document.getElementById("pixTexto").innerText = doc.data().pix || "Ainda não cadastrada";
      } else {
        document.getElementById("pixTexto").innerText = "Ainda não cadastrada";
      }
    });

    function mostrarPagamento() {
      var nome = document.getElementById("nome").value;
      var telefone = document.getElementById("telefone").value;
      var nickname = document.getElementById("nickname").value;

      if (nome === "" || telefone === "") {
        alert("Preenche nome e telefone antes de continuar!");
        return;
      }

      db.collection("cadastros").add({
        nome: nome,
        telefone: telefone,
        nickname: nickname,
        pagou: false,
        dataCadastro: new Date()
      });

      document.getElementById("areaPagamento").classList.remove("escondido");
    }

    function chamarAdm() {
      var nome = document.getElementById("nome").value;
      var telefone = document.getElementById("telefone").value;
      var nickname = document.getElementById("nickname").value;

      var mensagem = "Olá! Meus dados: Nome: " + nome + " | Telefone: " + telefone + " | Nick: " + nickname;
      var link = "https://wa.me/5521984022956?text=" + encodeURIComponent(mensagem);

      window.open(link, "_blank");
    }

    // ---- PÁGINA VIP ----

    function verificarPagamento() {
      var telefone = document.getElementById("vipTelefone").value;
      var resultado = document.getElementById("resultadoVip");
      resultado.innerHTML = "Verificando...";

      db.collection("cadastros").where("telefone", "==", telefone).get().then(function(snapshot) {
        if (snapshot.empty) {
          resultado.innerHTML = "<span class='pendente'>Telefone não encontrado. Confira se digitou certo.</span>";
          return;
        }

        var encontrouPago = false;
        snapshot.forEach(function(doc) {
          if (doc.data().pagou === true) {
            encontrouPago = true;
          }
        });

        if (!encontrouPago) {
          resultado.innerHTML = "<span class='pendente'>Pagamento ainda não confirmado. Aguarde o ADM confirmar.</span>";
          return;
        }

        db.collection("config").doc("geral").get().then(function(doc) {
          var codigo = doc.exists ? doc.data().codigoSala : "ainda não cadastrado";
          resultado.innerHTML = "<div class='codigo-box'>Código da sala:<br>" + codigo + "</div>";
        });
      });
    }

    // ---- MODO ADM ----

    function entrarAdm() {
      var senha = prompt("Digite a senha de administrador:");
      if (senha === "4002") {
        document.getElementById("painelAdm").classList.remove("escondido");
        carregarPainelAdm();
      } else if (senha !== null) {
        alert("Senha incorreta!");
      }
    }

    function salvarConfig() {
      var pix = document.getElementById("admPix").value;
      var codigoSala = document.getElementById("admCodigoSala").value;

      db.collection("config").doc("geral").set({
        pix: pix,
        codigoSala: codigoSala
      });

      alert("Salvo com sucesso!");
      document.getElementById("pixTexto").innerText = pix;
    }

    function carregarPainelAdm() {
      db.collection("cadastros").orderBy("dataCadastro", "desc").onSnapshot(function(snapshot) {
        var html = "";
        snapshot.forEach(function(doc) {
          var dados = doc.data();
          var status = dados.pagou
            ? '<span class="pago">PAGOU</span>'
            : '<span class="pendente">pendente</span>';

          html += '<div class="pessoa">';
          html += '<b>' + dados.nome + '</b> - ' + dados.telefone + ' - ' + dados.nickname + '<br>';
          html += status + ' &nbsp; ';
          html += '<button onclick="confirmarPagamento(\'' + doc.id + '\')">Confirmar pagamento</button>';
          html += '</div>';
        });
        document.getElementById("listaCadastros").innerHTML = html;
      });
    }

    function confirmarPagamento(id) {
      db.collection("cadastros").doc(id).update({ pagou: true });
    }
  </script>
</body>
</html>
